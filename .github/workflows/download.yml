name: Download YouTube and Upload to Release

on:
  repository_dispatch:
    types: [download]

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # نیازی به checkout نیست، مگر اینکه فایل دیگری از مخزن لازم داشته باشیم
      # - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # آخرین نسخهٔ پایدار

      - name: Create cookies file from secret
        run: echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      - name: Install yt-dlp
        run: pip install --retries 10 --timeout 30 yt-dlp

      - name: Set quality parameter
        id: vars
        run: |
          QUALITY="${{ github.event.client_payload.quality }}"
          if [[ -z "$QUALITY" ]]; then
            QUALITY="best[ext=mp4]/best"
          fi
          echo "Using format: $QUALITY"
          echo "format=$QUALITY" >> $GITHUB_OUTPUT

      - name: Download video
        run: |
          yt-dlp -f "${{ steps.vars.outputs.format }}" \
            --cookies cookies.txt \
            --js-runtimes node \
            --remote-components ejs:github \
            -o "video.mp4" \
            "${{ github.event.client_payload.url }}" || yt-dlp -f "best[ext=mp4]/best" --cookies cookies.txt --js-runtimes node --remote-components ejs:github -o "video.mp4" "${{ github.event.client_payload.url }}"

      - name: Verify file
        run: |
          if [ ! -f video.mp4 ] || [ ! -s video.mp4 ]; then
            echo "video.mp4 is missing or empty!"
            exit 1
          fi

      - name: Upload to Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "video.mp4"
          tag: "v1.${{ github.run_number }}"
          name: "Download #${{ github.run_number }}"
          body: "Video URL: ${{ github.event.client_payload.url }}"
          token: ${{ secrets.GITHUB_TOKEN }}
